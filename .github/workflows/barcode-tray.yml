name: BarcodeTray

# Compile, teste et publie BarcodeTray (dossier BarcodeTray/ de ce dépôt).
#   - core-tests    : tests de la bibliothèque Code 128 (Linux)
#   - windows-build : tests de l'application + exécutable unique BarcodeTray.exe (artefact "BarcodeTray-win-x64")
#   - release       : uniquement sur un tag "barcodetray-v*" (ex. barcodetray-v1.0.0) : crée une Release GitHub avec l'exe

on:
  push:
    branches:
      - '**'
    tags:
      - 'barcodetray-v*'
    paths:
      - 'BarcodeTray/**'
      - '.github/workflows/barcode-tray.yml'
  pull_request:
    paths:
      - 'BarcodeTray/**'
      - '.github/workflows/barcode-tray.yml'
  workflow_dispatch:

concurrency:
  group: barcode-tray-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  core-tests:
    name: Tests Code128 (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests de la bibliothèque Code 128
        run: dotnet test BarcodeTray/tests/Code128.Tests/Code128.Tests.csproj -c Release --logger "console;verbosity=normal"

  windows-build:
    name: Tests et exécutable (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: BarcodeTray
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Afficher la version du SDK .NET
        run: dotnet --version

      - name: Restaurer les paquets
        run: |
          dotnet restore BarcodeTray.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Les tests ne doivent pas empêcher de récupérer l'exécutable : on les laisse échouer sans arrêter le job,
      # on publie et on archive l'exe, puis l'étape finale « Bilan des tests » rend le job rouge si besoin.
      - name: Tests de l'application (Windows)
        id: app_tests
        continue-on-error: true
        run: dotnet test tests/BarcodeTray.Tests/BarcodeTray.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=barcodetray-tests.trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: Publier l'exécutable unique (win-x64, autonome)
        run: dotnet publish src/BarcodeTray -c Release -o publish

      - name: Vérifier que le dossier publish ne contient que BarcodeTray.exe
        run: |
          $root = (Resolve-Path publish).Path
          $files = @(Get-ChildItem -Path $root -Force -Recurse | Where-Object { -not $_.PSIsContainer })
          Write-Host "Contenu de ${root} :"
          foreach ($f in $files) {
            $relative = $f.FullName.Substring($root.Length + 1)
            Write-Host ('  {0,14:N0} octets  {1}' -f $f.Length, $relative)
          }

          $exe = @($files | Where-Object { $_.Name -eq 'BarcodeTray.exe' -and $_.DirectoryName -eq $root })
          if ($exe.Count -ne 1) {
            Write-Host "::error title=Publication::BarcodeTray.exe est absent du dossier publish."
            exit 1
          }

          $extra = @($files | Where-Object { $_.FullName -ne $exe[0].FullName -and $_.Extension -ne '.pdb' })
          if ($extra.Count -gt 0) {
            $names = ($extra | ForEach-Object { $_.FullName.Substring($root.Length + 1) }) -join ', '
            Write-Host "::error title=Publication::la publication n'est pas un fichier unique, fichiers en trop : ${names}"
            exit 1
          }

          $sizeMb = [math]::Round($exe[0].Length / 1MB, 1)
          Write-Host "BarcodeTray.exe : ${sizeMb} Mo ($($exe[0].Length) octets)"
          if ($exe[0].Length -lt 20MB) {
            Write-Host "::error title=Publication::BarcodeTray.exe fait seulement ${sizeMb} Mo : le runtime .NET ne semble pas inclus (exécutable non autonome)."
            exit 1
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "BarcodeTray.exe : **${sizeMb} Mo**, fichier unique autonome (win-x64)."

      - name: Auto-test de l'exécutable publié (--selftest)
        run: |
          $exe = Join-Path (Get-Location).Path 'publish\BarcodeTray.exe'
          $png = Join-Path (Get-Location).Path 'selftest-out.png'
          if (Test-Path $png) { Remove-Item $png -Force }

          # Application Windows (sans console) : Start-Process + attente bornée, sinon PowerShell n'attend pas la fin.
          $p = Start-Process -FilePath $exe -ArgumentList @('--selftest', ('"{0}"' -f $png)) -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) {
            try { $p.Kill() } catch { }
            Write-Host "::error title=Auto-test::BarcodeTray.exe --selftest n'a pas terminé en 120 s."
            exit 1
          }
          $p.WaitForExit()
          Write-Host "Code de sortie : $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Write-Host "::error title=Auto-test::BarcodeTray.exe --selftest a échoué (code $($p.ExitCode))."
            exit 1
          }

          if (-not (Test-Path $png)) {
            Write-Host "::error title=Auto-test::le fichier PNG n'a pas été créé."
            exit 1
          }
          $bytes = [System.IO.File]::ReadAllBytes($png)
          Write-Host "PNG : $($bytes.Length) octets"
          if ($bytes.Length -lt 300) {
            Write-Host "::error title=Auto-test::PNG trop petit ($($bytes.Length) octets)."
            exit 1
          }
          $signature = [byte[]](0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A)
          for ($i = 0; $i -lt 8; $i++) {
            if ($bytes[$i] -ne $signature[$i]) {
              Write-Host "::error title=Auto-test::signature PNG invalide."
              exit 1
            }
          }
          # Chunk IHDR : largeur et hauteur (entiers 32 bits, gros-boutiste) aux positions 16 et 20.
          $width = ([int]$bytes[16] -shl 24) -bor ([int]$bytes[17] -shl 16) -bor ([int]$bytes[18] -shl 8) -bor [int]$bytes[19]
          $height = ([int]$bytes[20] -shl 24) -bor ([int]$bytes[21] -shl 16) -bor ([int]$bytes[22] -shl 8) -bor [int]$bytes[23]
          Write-Host "Dimensions : ${width} x ${height} px"
          if ($width -lt 100 -or $width -gt 2000 -or $height -lt 100 -or $height -gt 500) {
            Write-Host "::error title=Auto-test::dimensions inattendues (${width} x ${height} px)."
            exit 1
          }
          Write-Host "Auto-test réussi."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Auto-test --selftest : OK (PNG ${width} x ${height} px)."

      - name: Lancement de contrôle en mode zone de notification (--tray, 6 s)
        continue-on-error: true
        run: |
          $exe = Join-Path (Get-Location).Path 'publish\BarcodeTray.exe'
          $logDir = Join-Path $env:LOCALAPPDATA 'BarcodeTray'
          $log = Join-Path $logDir 'barcodetray.log'

          # Les tests et l'auto-test ont déjà écrit dans le journal : on le met de côté (il reste dans l'artefact de
          # diagnostic) pour ne juger que ce lancement.
          if (Test-Path $log) {
            Copy-Item -Path $log -Destination (Join-Path (Get-Location).Path 'ci-barcodetray-before-tray.log') -Force
          }
          Remove-Item -Path (Join-Path $logDir 'barcodetray.log*') -Force -ErrorAction SilentlyContinue

          $p = Start-Process -FilePath $exe -ArgumentList @('--tray') -PassThru
          $null = $p.Handle
          $failed = $false
          try {
            Start-Sleep -Seconds 6
            $p.Refresh()
            if ($p.HasExited) {
              Write-Host "::warning title=Lancement --tray::le processus BarcodeTray.exe s'est arrêté avant 6 s (code de sortie $($p.ExitCode)). Ce contrôle ne fait pas échouer la construction, mais l'application devrait rester ouverte dans la zone de notification : voir le journal ci-dessous."
              $failed = $true
            }
            elseif ($p.MainWindowHandle -ne [IntPtr]::Zero) {
              # En mode --tray sain, aucune fenêtre visible n'existe : une fenêtre ouverte est une boîte d'erreur de
              # démarrage que personne ne ferme (le processus reste vivant, mais l'utilisateur verrait une erreur).
              Write-Host "::warning title=Lancement --tray::une fenêtre est ouverte (titre : '$($p.MainWindowTitle)') alors que le mode --tray ne doit en afficher aucune : probablement une boîte d'erreur de démarrage restée sans réponse. Voir le journal ci-dessous."
              $failed = $true
            }
            else {
              Write-Host "Le processus tourne toujours après 6 s (PID $($p.Id)), sans fenêtre ouverte : OK."
            }
          }
          finally {
            if (-not $p.HasExited) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }

          # Le journal du lancement ne doit contenir aucune erreur.
          if (Test-Path $log) {
            $errors = @(Select-String -Path $log -Pattern '\[ERROR\]')
            if ($errors.Count -gt 0) {
              $lines = ($errors | Select-Object -First 5 | ForEach-Object { $_.Line }) -join ' | '
              Write-Host "::warning title=Lancement --tray::le journal contient $($errors.Count) erreur(s) : ${lines}"
              $failed = $true
            }
          } else {
            Write-Host "::warning title=Lancement --tray::aucun journal écrit par le lancement (${log})."
            $failed = $true
          }

          if ($failed) { exit 1 }

      - name: Journal de l'application (diagnostic)
        if: always()
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'BarcodeTray\barcodetray.log'
          if (Test-Path $log) {
            Write-Host "--- $log (80 dernières lignes) ---"
            Get-Content -Path $log -Tail 80
            Copy-Item -Path $log -Destination (Join-Path (Get-Location).Path 'ci-barcodetray.log') -Force
          } else {
            Write-Host "Aucun journal trouvé ($log)."
          }

      - name: Archiver l'exécutable (artefact BarcodeTray-win-x64)
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeTray-win-x64
          path: BarcodeTray/publish/BarcodeTray.exe
          if-no-files-found: error
          retention-days: 90

      - name: Archiver les éléments de diagnostic (PNG de l'auto-test, journal, résultats de tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeTray-ci-diagnostics
          path: |
            BarcodeTray/selftest-out.png
            BarcodeTray/ci-barcodetray.log
            BarcodeTray/ci-barcodetray-before-tray.log
            BarcodeTray/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

      - name: Bilan des tests de l'application
        if: steps.app_tests.outcome == 'failure'
        run: |
          Write-Host "::error title=Tests::des tests de l'application ont échoué (voir l'étape « Tests de l'application (Windows) »). L'exécutable a quand même été archivé (artefact BarcodeTray-win-x64), mais ne le considérez pas comme vérifié."
          exit 1

  release:
    name: Publier une Release GitHub
    if: startsWith(github.ref, 'refs/tags/barcodetray-v')
    needs:
      - core-tests
      - windows-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Télécharger l'exécutable
        uses: actions/download-artifact@v4
        with:
          name: BarcodeTray-win-x64
          path: dist

      - name: Créer (ou mettre à jour) la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist
          sha256=$(sha256sum dist/BarcodeTray.exe | cut -d ' ' -f 1)
          version="${TAG#barcodetray-v}"
          # Empreinte jointe en fichier : elle est publiée aussi quand la Release a été créée à la main sur le site
          # (dans ce cas les notes ci-dessous ne sont pas utilisées).
          echo "${sha256}  BarcodeTray.exe" > dist/BarcodeTray.exe.sha256
          {
            echo "BarcodeTray ${version} : un seul fichier, BarcodeTray.exe (Windows 64 bits), sans installation."
            echo
            echo "SHA-256 : \`${sha256}\`"
            echo
            echo "Fichier non signé : Windows SmartScreen peut afficher un avertissement (Plus d'infos puis Exécuter quand même). Voir BarcodeTray/README.md."
          } > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/BarcodeTray.exe dist/BarcodeTray.exe.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/BarcodeTray.exe dist/BarcodeTray.exe.sha256 --repo "$GITHUB_REPOSITORY" --title "BarcodeTray ${version}" --notes-file notes.md --verify-tag
          fi
