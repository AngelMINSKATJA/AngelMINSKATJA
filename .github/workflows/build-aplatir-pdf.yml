name: Build AplatirPDF.exe

on:
  push:
    branches: ["claude/pdf-signature-flattener-qwp90y"]
    paths:
      - "aplatir-pdf/**"
      - ".github/workflows/build-aplatir-pdf.yml"
    tags: ["aplatir-pdf-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: aplatir-pdf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aplatir-pdf/requirements*.txt

      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Fabriquer l'exécutable
        run: python build.py

      - name: Auto-test de l'exe (sans interface)
        shell: pwsh
        run: |
          $rapport = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath ".\dist\AplatirPDF.exe" -ArgumentList "--selftest", "`"$rapport`"" -Wait -PassThru
          if (Test-Path $rapport) { Get-Content $rapport } else { Write-Host "Aucun rapport écrit" }
          if ($p.ExitCode -ne 0) { throw "L'auto-test a échoué (code $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: AplatirPDF-windows
          path: aplatir-pdf/dist/AplatirPDF.exe
          if-no-files-found: error

  release:
    # Uniquement quand on pousse une étiquette « aplatir-pdf-vX.Y » : publie l'exe en téléchargement direct
    if: startsWith(github.ref, 'refs/tags/aplatir-pdf-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AplatirPDF-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: AplatirPDF.exe
